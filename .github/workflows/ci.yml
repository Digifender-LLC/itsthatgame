name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Ad/tracking dependency guard (SEC-1)
        run: pnpm deps:check
      - name: Docs check
        run: pnpm docs:check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Catalog and bundle-size checks (FR-GAME-2, NFR-3)
        run: node scripts/check_catalog.mjs && node scripts/check_bundle_size.mjs
      - name: Install Playwright browser
        run: pnpm --filter @itg/shell exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # D14/D16: build an installable debug APK on every PR and main push, for sideloading.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # main only: refresh the rolling "android-debug" prerelease
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - name: Build web assets and sync them into the Android project
        env:
          VITE_ALLOW_DEV_PURCHASES: "1" # sideload builds unlock premium games without a store
        run: pnpm --filter @itg/shell build && pnpm --filter @itg/shell exec cap sync android
      # Keep one debug signing key across runs so a new build installs over the old one.
      # It is generated by the Android Gradle plugin on first use and never committed.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - name: Assemble debug APK
        working-directory: apps/shell/android
        env:
          ITG_VERSION_CODE: ${{ github.run_number }}
          ITG_VERSION_NAME: 0.1.${{ github.run_number }}-debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: |
          mkdir -p out
          cp apps/shell/android/app/build/outputs/apk/debug/app-debug.apk \
            "out/itsthatgame-debug-${{ github.run_number }}.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: itsthatgame-debug-apk-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30
      - name: Publish rolling prerelease (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-debug --cleanup-tag --yes || true
          gh release create android-debug out/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Android debug build ${{ github.run_number }}" \
            --notes "Debug build of main at $GITHUB_SHA for sideloading. Not for store release. See docs/runbooks/android-sideload.md."

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action needs a paid license for organization repos; the
      # gitleaks CLI itself is MIT-licensed, so run it directly.
      - name: Secret scan (SEC-2)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest
          git /repo --redact --verbose
