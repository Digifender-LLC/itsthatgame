<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Remove my email - ItsThatGame</title>
    <meta name="description" content="Remove your email address from the ItsThatGame waitlist." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%234c25c4'/%3E%3Crect x='4' y='4' width='3' height='3' fill='%23ffd23f'/%3E%3Crect x='9' y='9' width='3' height='3' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <a class="sr-only" href="#main">Skip to content</a>
    <header class="site">
      <div class="wrap">
        <a class="brand" href="/">ItsThatGame</a>
        <nav class="site" aria-label="Site">
          <a href="/support.html">Support</a>
          <a href="/privacy.html">Privacy</a>
        </nav>
      </div>
    </header>
    <main id="main">
      <div class="wrap prose">
        <h1>Remove my email</h1>
        <p>Enter the email address you signed up with and we'll delete it from the waitlist.</p>
        <div id="success" class="success" hidden>
          <h2 id="success-title" tabindex="-1">Done</h2>
          <p>If that email was on the list, it has been removed.</p>
        </div>
        <form id="unsubscribe-form" novalidate>
          <div class="field">
            <label class="lbl" for="email">Email address</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              inputmode="email"
              required
              aria-describedby="email-error"
            />
            <p class="error" id="email-error" aria-live="polite"></p>
          </div>
          <div class="field">
            <div id="turnstile-widget"></div>
            <p class="error" id="turnstile-error" aria-live="polite"></p>
          </div>
          <p id="form-status" aria-live="polite" role="status"></p>
          <button id="submit" class="primary" type="submit">Remove my email</button>
        </form>
      </div>
    </main>
    <footer class="site">
      <div class="wrap">
        <p>
          <a href="/privacy.html">Privacy notice</a>
          <a href="/terms.html">Terms</a>
          <a href="/support.html">Support</a>
          <a href="/unsubscribe.html">Remove my email</a>
        </p>
        <p>Published by Digifender LLC. No ads. No tracking.</p>
      </div>
    </footer>
    <script type="module" src="/src/unsubscribe.ts"></script>
  </body>
</html>
